name: Release

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE_NAME: videoflow
  REGISTRY: ghcr.io

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          make_latest: true
          body: |
            ## VideoFlow ${{ steps.version.outputs.tag }}

            ### 安装方式

            推荐使用 Docker 一键部署，镜像已发布到 GitHub Container Registry：

            ```bash
            docker pull ghcr.io/studynoweekend/videoflow:${{ steps.version.outputs.version }}
            ```

            启动容器：

            ```bash
            docker run -d --name videoflow \
              --restart unless-stopped \
              -p 8080:80 \
              -v "$PWD/data:/app/data" \
              -v "$PWD/logs:/app/logs" \
              ghcr.io/studynoweekend/videoflow:${{ steps.version.outputs.version }}
            ```

            浏览器打开 `http://localhost:8080` 即可使用。

            > Whisper ASR 和 Lada 视频修复组件已支持 **Web 界面插件化安装**，无需命令行脚本，在「组件管理」页面一键安装即可。

            ### 支持的架构

            - `linux/amd64`（x86_64 PC、服务器）
            - `linux/arm64`（Apple Silicon、树莓派、ARM 服务器）

            ### 更新内容

            - 🎉 组件插件化安装：Whisper ASR / Lada / FFmpeg 均可在 Web 界面一键安装
            - 🐳 多架构镜像：原生支持 amd64 + arm64
            - 🗑️ 移除 install.sh 命令行安装脚本，降低部署门槛
            - 📖 README 更新：推荐 Docker 部署方式
